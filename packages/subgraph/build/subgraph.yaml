specVersion: 1.2.0
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: XYXEvidenceRegistry
    network: arc-testnet
    source:
      address: "0xfB94329c89Af2FC541bEf32e1ec99cbed87a39F2"
      abi: XYXEvidenceRegistry
      startBlock: 61238484
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Endpoint
        - Receipt
      abis:
        - name: XYXEvidenceRegistry
          file: XYXEvidenceRegistry/XYXEvidenceRegistry.json
      eventHandlers:
        - event: ReceiptAnchored(indexed bytes32,indexed bytes32,indexed
            bytes32,address,uint128,bytes32,bytes32,bytes32,bytes32,bytes32,bytes32,uint32,uint16,uint8,uint64,address,uint256,string)
          handler: handleReceiptAnchored
      file: XYXEvidenceRegistry/XYXEvidenceRegistry.wasm
  - kind: ethereum
    name: XYXEvaluator
    network: arc-testnet
    source:
      address: "0xCEBFedAc66B0fFfAD452D3f1B356D1A3120dB233"
      abi: XYXEvaluator
      startBlock: 61238490
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Job
      abis:
        - name: XYXEvaluator
          file: XYXEvaluator/XYXEvaluator.json
      eventHandlers:
        - event: JobVerdictExecuted(indexed bytes32,indexed uint256,uint8,bytes32,bytes32,indexed
            address)
          handler: handleVerdict
      file: XYXEvaluator/XYXEvaluator.wasm
  - kind: ethereum
    name: AgenticCommerce
    network: arc-testnet
    source:
      address: "0x0747EEf0706327138c69792bF28Cd525089e4583"
      abi: AgenticCommerce
      startBlock: 61238484
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Job
      abis:
        - name: AgenticCommerce
          file: AgenticCommerce/AgenticCommerce.json
      eventHandlers:
        - event: JobCreated(indexed uint256,indexed address,indexed address,address,uint256,address)
          handler: handleJobCreated
        - event: BudgetSet(indexed uint256,uint256)
          handler: handleBudgetSet
        - event: JobFunded(indexed uint256,indexed address,uint256)
          handler: handleJobFunded
        - event: JobSubmitted(indexed uint256,indexed address,bytes32)
          handler: handleJobSubmitted
        - event: JobCompleted(indexed uint256,indexed address,bytes32)
          handler: handleJobCompleted
        - event: JobRejected(indexed uint256,indexed address,bytes32)
          handler: handleJobRejected
        - event: JobExpired(indexed uint256)
          handler: handleJobExpired
      file: AgenticCommerce/AgenticCommerce.wasm
  - kind: ethereum
    name: ERC8004Identity
    network: arc-testnet
    source:
      address: "0x8004A818BFB912233c491871b3d84c89A494BD9e"
      abi: IdentityRegistry
      startBlock: 61238484
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AgentIdentity
      abis:
        - name: IdentityRegistry
          file: ERC8004Identity/IdentityRegistry.json
      eventHandlers:
        - event: Registered(indexed uint256,string,indexed address)
          handler: handleRegistered
      file: ERC8004Identity/ERC8004Identity.wasm
  - kind: ethereum
    name: ERC8004Validation
    network: arc-testnet
    source:
      address: "0x8004Cb1BF31DAf7788923b405b754f57acEB4272"
      abi: ValidationRegistry
      startBlock: 61238484
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Validation
      abis:
        - name: ValidationRegistry
          file: ERC8004Validation/ValidationRegistry.json
      eventHandlers:
        - event: ValidationResponse(indexed address,indexed uint256,indexed
            bytes32,uint8,string,bytes32,string)
          handler: handleValidationResponse
      file: ERC8004Validation/ERC8004Validation.wasm
  - kind: ethereum
    name: ERC8004Reputation
    network: arc-testnet
    source:
      address: "0x8004B663056A597Dffe9eCcC1965A193B7388713"
      abi: ReputationRegistry
      startBlock: 61238484
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Feedback
      abis:
        - name: ReputationRegistry
          file: ERC8004Reputation/ReputationRegistry.json
      eventHandlers:
        - event: NewFeedback(indexed uint256,indexed address,uint64,int128,uint8,indexed
            string,string,string,string,string,bytes32)
          handler: handleNewFeedback
        - event: FeedbackRevoked(indexed uint256,indexed address,indexed uint64)
          handler: handleFeedbackRevoked
      file: ERC8004Reputation/ERC8004Reputation.wasm
